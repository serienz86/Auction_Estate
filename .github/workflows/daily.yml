name: daily-scrape
on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 KST (PC가 꺼져 있으면 켜질 때까지 대기)
  workflow_dispatch:        # 수동 실행 버튼
permissions:
  contents: write
jobs:
  scrape:
    runs-on: self-hosted    # 집 PC 러너에서 실행 (국내 IP)
    timeout-minutes: 30
    defaults:
      run:
        shell: bash         # Windows는 Git for Windows의 bash 사용
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install chromium
      - run: python scrape.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
      - name: commit data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "update $(date -u +%F)" && git push)
