<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>경·공매 아파트 아침 브리핑</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mu:#6b7684;--bd:#e2e6ec;--ac:#2563eb;--hot:#dc2626;--ok:#059669;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#9aa5b4;--bd:#2c3440;--ac:#6ea0ff;--hot:#ff7b7b;--ok:#3ddc97;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b212a;--tx:#e8ecf2;--mu:#9aa5b4;--bd:#2c3440;--ac:#6ea0ff;--hot:#ff7b7b;--ok:#3ddc97;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
.w{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:20px;margin:4px 0}.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:99px;padding:5px 11px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 9px}
input,select{flex:1;min-width:110px}textarea{width:100%;height:110px;font-size:12px}
button{cursor:pointer}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
a.btn{display:inline-block;text-decoration:none;color:var(--ac);border:1px solid var(--ac);border-radius:8px;padding:7px 10px;font-size:13px}
.stat{display:flex;gap:14px;font-size:13px;color:var(--mu);margin:2px 0 10px}.stat b{color:var(--tx)}
.it{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.it.new{border-color:var(--hot)}
.t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ad{font-weight:600}.tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);white-space:nowrap}
.tag.n{color:var(--hot);border-color:var(--hot)}
.g{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:13px}.g span{color:var(--mu)}
.dc{color:var(--ok);font-weight:700}
details summary{cursor:pointer;font-weight:600}
.em{text-align:center;color:var(--mu);padding:24px}
</style>
</head>
<body>
<div class="w">
<h1>경·공매 아파트 아침 브리핑</h1>
<div class="sub" id="today"></div>
<div class="row" style="margin:0 0 12px"><button class="p" id="rf">↻ 새로고침</button><span class="sub" id="upd" style="align-self:center;margin:0"></span></div>

<div class="box">
  <div class="chips" id="regions"></div>
  <div class="row">
    <input id="q" placeholder="주소·사건번호 검색">
    <input id="max" type="number" inputmode="numeric" placeholder="최저가 상한(억)">
  </div>
  <div class="row">
    <select id="src"><option value="">전체 출처</option><option>법원경매</option><option>온비드</option></select>
    <select id="sort">
      <option value="date">매각기일 빠른 순</option>
      <option value="disc">할인율 높은 순</option>
      <option value="low">최저가 낮은 순</option>
      <option value="new">신규 등록 순</option>
    </select>
  </div>
  <div class="row">
    <a class="btn" href="https://www.courtauction.go.kr" target="_blank" rel="noopener">법원경매 ↗</a>
    <a class="btn" href="https://www.onbid.co.kr" target="_blank" rel="noopener">온비드 ↗</a>
  </div>
</div>

<div class="stat" id="stat"></div>
<div id="list"></div>

</div>

<script>
var REG=[
 {k:"서울",t:function(a){return /^서울/.test(a)}},
 {k:"성남",t:function(a){return /성남|분당|위례/.test(a)}},
 {k:"하남",t:function(a){return /하남/.test(a)}},
 {k:"광주",t:function(a){return /경기.*광주시|^광주시/.test(a)}},
 {k:"용인",t:function(a){return /용인/.test(a)}},
 {k:"이천",t:function(a){return /이천/.test(a)}},
 {k:"여주·양평",t:function(a){return /여주|양평/.test(a)}}
];
var KEY="auction_items_v1",SEL="auction_regions_v1";
var items=[],on={};
REG.forEach(function(r){on[r.k]=true});

function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function num(v){return Number(String(v==null?"":v).replace(/[^0-9.]/g,""))||0}
function won(n){if(!n)return"-";var e=Math.floor(n/1e8),m=Math.round((n%1e8)/1e4);return(e?e+"억 ":"")+(m?m.toLocaleString()+"만":"")||"0"}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
var TODAY=iso(new Date());
document.getElementById("today").textContent=TODAY+" 기준 · GitHub에서 매일 수집";

function parseCSV(t){
  var rows=[],r=[],c="",q=false;
  for(var i=0;i<t.length;i++){var ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;
    else if(ch==","){r.push(c);c=""}
    else if(ch=="\n"){r.push(c);rows.push(r);r=[];c=""}
    else if(ch!="\r")c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  if(rows.length<2)return[];
  var h=rows[0].map(function(x){return x.trim()});
  return rows.slice(1).filter(function(x){return x.join("").trim()}).map(function(x){var o={};h.forEach(function(k,i){o[k]=x[i]});return o});
}
function norm(o){
  var g=function(){for(var i=0;i<arguments.length;i++){if(o[arguments[i]]!=null&&o[arguments[i]]!=="")return o[arguments[i]]}return""};
  return{src:g("출처","src"),no:g("사건번호","no"),addr:String(g("주소","addr")),area:g("면적","area"),
    appr:num(g("감정가","appr")),low:num(g("최저가","low")),fail:num(g("유찰","fail")),
    date:String(g("매각기일","date")),reg:String(g("등록일","reg")),url:String(g("링크","url"))};
}
function parse(t){
  t=t.trim();if(!t)return[];
  var a;try{a=t[0]=="["||t[0]=="{"?JSON.parse(t):parseCSV(t)}catch(e){alert("형식을 읽지 못했습니다");return[]}
  if(!Array.isArray(a))a=[a];
  return a.map(norm).filter(function(x){return x.addr});
}
function dedupe(a){var m={};a.forEach(function(x){m[(x.src||"")+"|"+(x.no||x.addr)]=x});return Object.keys(m).map(function(k){return m[k]})}

function chips(){
  var el=document.getElementById("regions");el.innerHTML="";
  REG.forEach(function(r){var b=document.createElement("button");b.className="chip"+(on[r.k]?" on":"");b.textContent=r.k;
    b.onclick=function(){on[r.k]=!on[r.k];sv(SEL,on);chips();render()};el.appendChild(b)});
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function render(){
  var q=document.getElementById("q").value.trim(),mx=num(document.getElementById("max").value)*1e8,
      s=document.getElementById("src").value,so=document.getElementById("sort").value;
  var act=REG.filter(function(r){return on[r.k]});
  var L=items.filter(function(x){
    if(!act.some(function(r){return r.t(x.addr)}))return false;
    if(s&&x.src!=s)return false;
    if(mx&&x.low>mx)return false;
    if(q&&(x.addr+" "+x.no).indexOf(q)<0)return false;
    return true}).map(function(x){x.disc=x.appr&&x.low?Math.round((1-x.low/x.appr)*100):0;x.isNew=x.reg===TODAY;return x});
  L.sort(function(a,b){
    if(so=="disc")return b.disc-a.disc;
    if(so=="low")return a.low-b.low;
    if(so=="new")return (b.reg||"").localeCompare(a.reg||"");
    return (a.date||"9999").localeCompare(b.date||"9999")});
  var nw=L.filter(function(x){return x.isNew}).length;
  document.getElementById("stat").innerHTML="검색 결과 <b>"+L.length+"</b>건 · 오늘 신규 <b>"+nw+"</b>건 · 전체 저장 "+items.length+"건";
  var h=L.map(function(x){
    return '<div class="it'+(x.isNew?' new':'')+'"><div class="t"><div class="ad">'+esc(x.addr)+'</div><div>'+
      (x.isNew?'<span class="tag n">NEW</span> ':'')+'<span class="tag">'+esc(x.src||"기타")+'</span></div></div>'+
      '<div class="g"><div><span>최저가</span> <b>'+won(x.low)+'</b></div><div><span>감정가</span> '+won(x.appr)+'</div>'+
      '<div><span>할인율</span> <span class="dc">'+(x.disc?x.disc+"%":"-")+'</span>'+(x.fail?' · 유찰 '+x.fail+'회':'')+'</div>'+
      '<div><span>매각기일</span> '+esc(x.date||"-")+'</div>'+
      '<div><span>면적</span> '+esc(x.area?x.area+"㎡":"-")+'</div><div><span>사건번호</span> '+esc(x.no||"-")+'</div></div>'+
      (/^https?:\/\//.test(x.url)?'<div style="margin-top:8px"><a class="btn" target="_blank" rel="noopener" href="'+esc(x.url)+'">상세 보기 ↗</a></div>':'')+'</div>'}).join("");
  document.getElementById("list").innerHTML=h||'<div class="em">조건에 맞는 물건이 없습니다.<br>새로고침을 눌러 보세요.</div>';
}

function load(){var b=document.getElementById("rf"),u=document.getElementById("upd");b.disabled=true;u.textContent="불러오는 중…";
  fetch("data.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    items=d.items||[];sv(KEY,items);u.textContent=d.updated?"수집 "+d.updated:"데이터 없음";render()
  }).catch(function(){u.textContent="불러오기 실패 · 저장본 표시"}).then(function(){b.disabled=false})}
document.getElementById("rf").onclick=load;
["q","max","src","sort"].forEach(function(id){document.getElementById(id).oninput=render;document.getElementById(id).onchange=render});

items=ld(KEY,[]);var s0=ld(SEL,null);if(s0)REG.forEach(function(r){if(s0[r.k]!=null)on[r.k]=s0[r.k]});
chips();render();load();
</script>
</body>
</html>
